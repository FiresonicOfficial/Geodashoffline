name: Build Android APK (Kotlin Native)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Hazırla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android ve Kotlin Yapılandırmasını Hazırla
        run: |
          # 1. Dizinleri oluştur
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 2. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.configuration-cache=false
          kotlin.code.style=official
          EOF

          # 3. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Geodashoffline"
          include ':app'
          EOF

          # 4. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 5. Repodaki ana Activity dosyasını ve paket adını tespit et
          # Repodaki ilk MainActivity.kt veya herhangi bir .kt dosyasını tara
          MAIN_KT=$(find . -maxdepth 5 -name "*.kt" | head -n 1)

          if [ -n "$MAIN_KT" ]; then
            PKG_NAME=$(grep -E '^package ' "$MAIN_KT" | head -n 1 | sed -E 's/package[[:space:]]+([^;[:space:]]+).*/\1/')
            ACT_NAME=$(basename "$MAIN_KT" .kt)
          fi

          # Paket adı bulunamazsa varsayılan ata
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.firesonic.geodashoffline"
            ACT_NAME="MainActivity"
          fi

          echo "Tespit edilen Paket: $PKG_NAME"
          echo "Tespit edilen Activity: $ACT_NAME"

          # 6. app/build.gradle
          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace '$PKG_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId '$PKG_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 7. Kotlin kaynak dosyalarını doğru paket dizinine yerleştir
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          TARGET_DIR="app/src/main/java/$PKG_PATH"
          mkdir -p "$TARGET_DIR"

          # Repodaki tüm .kt dosyalarını app dizinine taşı
          find . -maxdepth 5 -name "*.kt" -not -path "*/app/*" -exec cp {} "$TARGET_DIR/" \; 2>/dev/null || true

          # Repodaki diğer tüm kaynak/oyun dosyalarını assets'e al
          cp -r $(ls -A | grep -vE '^\.git$|^\.github$|^app$|^build.gradle$|^settings.gradle$|^gradle.properties$') app/src/main/assets/ 2>/dev/null || true

          # 8. AndroidManifest.xml (Bulunan Kotlin Activity'sini çalıştırır)
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Geometry Dash Offline"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".$ACT_NAME"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Geometry Dash Offline</string>
          </resources>
          EOF

      - name: APK Derle (assembleDebug)
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: APK'yı Çıkar (Artifact Olarak İndir)
        uses: actions/upload-artifact@v4
        with:
          name: geodashoffline-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
