name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GeoDash APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/accept_licenses.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Licenses
        run: bash .github/scripts/accept_licenses.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.builder.sdkDownload=true

      - name: Stage Release APK Artifact
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/*.apk build-output/GeoDash-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoDash-v2.0.0-APK
          path: build-output/GeoDash-v2.0.0.apk
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GeoDash v2.0.0 - Wave & UFO Gamemodes Update"
          body: |
            ## 🚀 GeoDash v2.0.0 - Major Update

            ### ✨ What's New:
            - **Wave Gamemode**: Iconic 45-degree diagonal darting flight! Hold to dart up, release to dart down, navigate sharp zigzags and tight corridors.
            - **UFO Gamemode**: Flappy-style mid-air hops! Tap to flap upward through floating hazards and sawblade gauntlets.
            - **All 18 Campaign Levels Overhauled (30+ Seconds Each)**:
              - Full-length, authentic pacing and progression.
              - Distinct visual themes, custom color trigger transitions, and decorative elements.
              - Unique gameplay mechanics tailored to each level's identity.
            - **New Portal Types**: Wave Portals (`PORTAL_WAVE`) and UFO Portals (`PORTAL_UFO`) available in gameplay and the Level Editor.
            - **Pure Decoration Category**: 12 hitbox-free aesthetic objects (chains, neon arrows, stars, pulse rings, monster eyes, crystals).
            - **Editor Improvements**: Hidden color triggers during gameplay, visible with guide lines in editor mode.
          files: build-output/GeoDash-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
