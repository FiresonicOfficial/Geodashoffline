name: Build Android APK (Geodashoffline)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Hazırla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android Yapısını Hazırla
        run: |
          mkdir -p app/src/main/java/com/firesonic/geodashoffline
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # Repodaki oyun ve kaynak dosyalarını assets içine aktar
          cp -r $(ls -A | grep -vE '^\.git$|^\.github$|^app$|^build.gradle$|^settings.gradle$|^gradle.properties$') app/src/main/assets/ 2>/dev/null || true

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.configuration-cache=false
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Geodashoffline"
          include ':app'
          EOF

          # build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.firesonic.geodashoffline'
              compileSdk 34

              defaultConfig {
                  applicationId "com.firesonic.geodashoffline"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # app/src/main/AndroidManifest.xml (Yatay ekran ve tam ekran yapılandırması)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Geometry Dash Offline"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # app/src/main/res/values/strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Geometry Dash Offline</string>
          </resources>
          EOF

          # app/src/main/java/com/firesonic/geodashoffline/MainActivity.java
          cat << 'EOF' > app/src/main/java/com/firesonic/geodashoffline/MainActivity.java
          package com.firesonic.geodashoffline;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.TextView;
          import android.widget.RelativeLayout;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Tam ekran immersive mod
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  RelativeLayout layout = new RelativeLayout(this);
                  TextView tv = new TextView(this);
                  tv.setText("Geometry Dash Offline\nYerel Motor Aktif.");
                  tv.setTextSize(18);
                  
                  RelativeLayout.LayoutParams params = new RelativeLayout.LayoutParams(
                      RelativeLayout.LayoutParams.WRAP_CONTENT,
                      RelativeLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.addRule(RelativeLayout.CENTER_IN_PARENT);
                  layout.addView(tv, params);

                  setContentView(layout);
              }
          }
          EOF

      - name: APK Derle (assembleDebug)
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: APK'yı Çıkar (Artifact Olarak İndir)
        uses: actions/upload-artifact@v4
        with:
          name: geodashoffline-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
