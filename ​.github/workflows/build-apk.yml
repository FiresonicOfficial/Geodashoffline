name: Build Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Hazırla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Proje Yapısını ve Motoru Sıfırdan İnşa Et
        run: |
          # 1. Klasör düzeni
          mkdir -p app/src/main/java/com/firesonic/geodash
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 2. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.configuration-cache=false
          EOF

          # 3. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Geodashoffline"
          include ':app'
          EOF

          # 4. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 5. app/build.gradle (Sıfır çakışma, saf ve bağımsız Android SDK)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.firesonic.geodash'
              compileSdk 34

              defaultConfig {
                  applicationId "com.firesonic.geodash"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 6. Repodaki tüm oyun dosyalarını (varsa html, js, ses, resim, data) assets dizinine aktar
          cp -r $(ls -A | grep -vE '^\.git$|^\.github$|^app$|^build.gradle$|^settings.gradle$|^gradle.properties$') app/src/main/assets/ 2>/dev/null || true

          # 7. MainActivity.java - Yerel Çevrimdışı Çalıştırıcı Motor
          cat << 'EOF' > app/src/main/java/com/firesonic/geodash/MainActivity.java
          package com.firesonic.geodash;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private WebView gameView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Tam ekran ve ekranı açık tutma
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  gameView = new WebView(this);
                  WebSettings settings = gameView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  gameView.setWebViewClient(new WebViewClient());

                  // Assets içinde index.html kontrolü yap, varsa aç, yoksa ana dizini listele
                  boolean hasIndex = false;
                  try {
                      InputStream is = getAssets().open("index.html");
                      if (is != null) {
                          hasIndex = true;
                          is.close();
                      }
                  } catch (Exception ignored) {}

                  if (hasIndex) {
                      gameView.loadUrl("file:///android_asset/index.html");
                  } else {
                      gameView.loadUrl("file:///android_asset/");
                  }

                  setContentView(gameView);
              }

              @Override
              public void onBackPressed() {
                  if (gameView != null && gameView.canGoBack()) {
                      gameView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 8. AndroidManifest.xml (Yatay Oyun Modu)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Geometry Dash Offline"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Geometry Dash Offline</string>
          </resources>
          EOF

      - name: APK Derle (assembleDebug)
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: geodashoffline-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
