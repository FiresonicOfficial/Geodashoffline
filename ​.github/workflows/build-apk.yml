name: Build Android APK (Kotlin Native)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: JDK 17 Hazırla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android ve Kotlin Altyapısını Hazırla
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.configuration-cache=false
          kotlin.code.style=official
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Geodashoffline"
          include ':app'
          EOF

          # build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # Repodaki .kt dosyalarını ve paket adını tespit et
          FIRST_KT=$(find . -maxdepth 6 -name "*.kt" -not -path "*/.*" | head -n 1)

          if [ -n "$FIRST_KT" ]; then
            PKG_NAME=$(grep -E '^[[:space:]]*package[[:space:]]+' "$FIRST_KT" | head -n 1 | sed -E 's/^[[:space:]]*package[[:space:]]+([^;[:space:]]+).*/\1/')
            ACT_NAME=$(grep -E 'class[[:space:]]+[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*.*Activity' "$FIRST_KT" | head -n 1 | sed -E 's/.*class[[:space:]]+([A-Za-z0-9_]+).*/\1/')
          fi

          [ -z "$PKG_NAME" ] && PKG_NAME="com.firesonic.geodashoffline"
          [ -z "$ACT_NAME" ] && ACT_NAME="MainActivity"

          echo "Belirlenen Paket: $PKG_NAME"
          echo "Belirlenen Activity: $ACT_NAME"

          # app/build.gradle (Genişletilmiş bağımlılık seti)
          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace '$PKG_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId '$PKG_NAME'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # Kaynak kodları doğru paket hiyerarşisine taşı
          PKG_DIR="app/src/main/java/$(echo "$PKG_NAME" | tr '.' '/')"
          mkdir -p "$PKG_DIR"

          find . -maxdepth 6 -name "*.kt" -not -path "*/app/*" -not -path "*/.*" -exec cp {} "$PKG_DIR/" \; 2>/dev/null || true

          # Repodaki diğer statik dosyaları assets içine aktar
          cp -r $(ls -A | grep -vE '^\.git$|^\.github$|^app$|^build.gradle$|^settings.gradle$|^gradle.properties$') app/src/main/assets/ 2>/dev/null || true

          # AndroidManifest.xml
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Geometry Dash Offline"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".$ACT_NAME"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Geometry Dash Offline</string>
          </resources>
          EOF

      - name: APK Derle (assembleDebug)
        run: gradle assembleDebug --no-daemon --no-configuration-cache --info

      - name: APK'yı Çıkar (Artifact Olarak İndir)
        uses: actions/upload-artifact@v4
        with:
          name: geodashoffline-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
